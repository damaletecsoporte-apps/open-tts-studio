<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open TTS Studio - Damián</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f5f5f7;
            --accent-green: #39ff14;
            --accent-yellow: #ffea00;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border: 2px solid var(--accent-yellow);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: var(--accent-green);
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--accent-yellow);
        }

        textarea, select {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        button {
            width: 100%;
            background-color: var(--accent-green);
            color: #000;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .player-container {
            margin-top: 25px;
            text-align: center;
            display: none;
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            color: var(--accent-yellow);
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎙️ Open TTS Studio</h1>
        
        <div class="form-group">
            <label for="text">Texto a sintetizar:</label>
            <textarea id="text" rows="4" placeholder="Escribe aquí lo que quieras que diga la IA..."></textarea>
        </div>

        <div class="form-group">
            <label for="voiceSelect">Elige una voz neuronal:</label>
            <select id="voiceSelect">
                <!-- Las voces se cargarán automáticamente desde el backend -->
            </select>
        </div>

        <button onclick="generateAudio()">Generar Audio</button>

        <div id="loading" class="loading">Generando audio con IA, por favor espera...</div>

        <div id="playerContainer" class="player-container">
            <label>Resultado:</label>
            <audio id="audioPlayer" controls></audio>
        </div>
    </div>

    <script>
        const API_URL = "";

       // Cargar las voces automáticamente desde FastAPI al abrir la página
        async function loadVoices() {
            try {
                const response = await fetch('/voices');
                const data = await response.json();
                const select = document.getElementById('voiceSelect');
                select.innerHTML = '';
                
                data.voices.forEach(voice => {
                    const option = document.createElement('option');
                    option.value = voice.id;
                    option.textContent = voice.name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error("Error al cargar las voces:", error);
            }
        }

        // Ejecutar al cargar la página
        window.onload = loadVoices;

        async function generateAudio() {
            const text = document.getElementById("text").value;
            const voice = document.getElementById("voiceSelect").value;
            const loading = document.getElementById("loading");
            const playerContainer = document.getElementById("playerContainer");
            const audioPlayer = document.getElementById("audioPlayer");

            if (!text.trim()) {
                alert("Por favor escribe algún texto.");
                return;
            }

            loading.style.display = "block";
            playerContainer.style.display = "none";

            try {
                const response = await fetch('/generate-audio', {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ text: text, voice: voice })
                });

                if (!response.ok) throw new Error("Error al generar el audio");

                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);
                
                audioPlayer.src = audioUrl;
                loading.style.display = "none";
                playerContainer.style.display = "block";
                audioPlayer.play();

            } catch (error) {
                alert("Hubo un error al procesar tu solicitud.");
                loading.style.display = "none";
                console.error(error);
            }
        }
    </script>
</body>
</html>
